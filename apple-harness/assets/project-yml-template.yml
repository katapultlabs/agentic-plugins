# XcodeGen project.yml — Apple Harness template
# Replace {{APP_NAME}}, {{BUNDLE_ID}}, {{DEPLOYMENT_TARGET}} then run: xcodegen generate
#
# Example: {{APP_NAME}}=Recipes, {{BUNDLE_ID}}=com.example.recipes, {{DEPLOYMENT_TARGET}}=18.0
# Swift 6, strict concurrency, warnings-as-errors enabled by default.
#
# IMPORTANT: You must also create the source files referenced below before running xcodegen:
#   Sources/App.swift, Sources/ContentView.swift, Sources/Info.plist
#   Tests/AppTests.swift, Tests/Info.plist
#   Resources/Assets.xcassets/ (with AppIcon.appiconset and AccentColor.colorset)

name: {{APP_NAME}}

options:
  bundleIdPrefix: ""
  deploymentTarget:
    iOS: "{{DEPLOYMENT_TARGET}}"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  {{APP_NAME}}:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: folder
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "{{BUNDLE_ID}}"
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    scheme:
      testTargets:
        - {{APP_NAME}}Tests
      run:
        config: Debug
      test:
        config: Debug
      profile:
        config: Release
      analyze:
        config: Debug
      archive:
        config: Release

  {{APP_NAME}}Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        type: folder
    dependencies:
      - target: {{APP_NAME}}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "{{BUNDLE_ID}}.Tests"
        INFOPLIST_FILE: Tests/Info.plist
